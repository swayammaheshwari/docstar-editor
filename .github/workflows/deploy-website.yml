name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      # `enablement: true` tries to turn on Pages (with source = GitHub Actions)
      # via the API if it isn't already — but the default GITHUB_TOKEN often
      # lacks the permission to do that on a repo's first-ever Pages setup. If
      # this step still fails with "Get Pages site failed" / "Not Found", it
      # means it doesn't: go to the repo's Settings -> Pages -> Build and
      # deployment -> Source, and set it to "GitHub Actions" manually (one-time,
      # required before any workflow can deploy to Pages).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
